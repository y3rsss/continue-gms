<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Continue? An index of video games: browse, compare scores, and keep a backlog of what to play next."
    />
    <title>Continue?</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Continue?" />
    <meta property="og:title" content="Continue? | The video game index" />
    <meta
      property="og:description"
      content="Browse games, compare scores and prices, and keep a backlog of what to play next."
    />
    <meta property="og:image" content="https://continue-gms.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      try {
        const edition = localStorage.getItem("continue.edition");
        if (edition === "night" || (!edition && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
